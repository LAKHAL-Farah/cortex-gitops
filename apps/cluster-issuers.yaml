# Let's Encrypt ClusterIssuers. Sync only after cert-manager is Healthy (CRDs must exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-issuers
  namespace: argocd
spec:
  project: cortex
  source:
    repoURL: https://github.com/LAKHAL-Farah/cortex-gitops.git
    targetRevision: main
    path: platform/cluster-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
