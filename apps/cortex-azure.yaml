# Argo CD Application for the Azure k3s cluster. Manual sync until the rehearsal is trusted.
# Prereqs: apps/sealed-secrets.yaml and apps/cert-manager.yaml Healthy, overlays/azure sealed + merged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortex-azure
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true   # same as the rehearsed k3d-sealed app
spec:
  project: cortex
  source:
    repoURL: https://github.com/LAKHAL-Farah/cortex-gitops.git
    targetRevision: main
    path: overlays/azure
  destination:
    server: https://kubernetes.default.svc
    namespace: cortex
  syncPolicy:
    # Switch to `automated: { prune: true, selfHeal: true }` when ready.
    syncOptions: [ServerSideApply=true]
