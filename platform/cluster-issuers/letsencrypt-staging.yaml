# HTTP-01 through k3s' bundled Traefik. Needs the A record to point at the public IP.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: farah.lakhal.enactus@gmail.com        # ACME account contact (expiry notices); Let's Encrypt rejects example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
