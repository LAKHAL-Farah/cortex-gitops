apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Same as overlays/k3d (local images, mailpit, Traefik) but WITHOUT the plaintext
# DEV secrets: `cortex-secrets` comes from a SealedSecret decrypted by the
# sealed-secrets controller running in the k3d cluster. This is the rehearsal
# for Step 6 / the Azure setup: only encrypted material is ever committed.
#
# Sealing keys are per cluster. If you recreate the k3d cluster you must re-run
#   OVERLAY=k3d-sealed ./scripts/seal-secrets.sh
# (or restore the old controller key, see README).
namespace: cortex

resources:
  - ../k3d
  # Uncomment after `OVERLAY=k3d-sealed ./scripts/seal-secrets.sh`:
  - sealed-cortex-secrets.yaml
  - sealed-collector-ssh.yaml

configMapGenerator:
  - name: cortex-config
    behavior: merge
    literals:
      - PROMETHEUS_BASE_URL=http://10.0.1.4:9090
      - PROMETHEUS_URL=http://10.0.1.4:9090/api/v1/query
      - PROMETHEUS_RANGE_URL=http://10.0.1.4:9090/api/v1/query_range
      - LOKI_URL=http://10.0.1.4:3100
      - QDRANT_COLLECTION=cortex-knowledge
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - EMBEDDING_DIMENSIONS=384
      - NVIDIA_NIM_MODEL=nvidia/nemotron-3-super-120b-a12b
      - NVIDIA_NIM_FAST_MODEL=nvidia/nemotron-3-super-120b-a12b
      - FORECAST_DATASET_REFRESH_INTERVAL_SECONDS=3600

patches:
  - target:
      kind: Secret
      name: collector-ssh
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: collector-ssh
  # Remove the generated DEV Secret inherited from ../k3d.
  - target:
      kind: Secret
      name: cortex-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: cortex-secrets
