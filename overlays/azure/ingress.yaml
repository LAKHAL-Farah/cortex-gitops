# Public entrypoint for Cortex on the k3s cluster (Traefik is k3s' bundled ingress controller).
# Certificate: cert-manager HTTP-01. Staging first; once `kubectl -n cortex get certificate`
# is Ready and the issuer is "(STAGING)", change the annotation to letsencrypt-prod via PR.
# NOTE: *.dev is HSTS-preloaded: browsers reject the untrusted staging cert with no bypass.
# Verify staging with curl -k; the browser only works once the prod cert is issued.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # then: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [cortex.cortexmonitoring.dev]
      secretName: cortex-tls
  rules:
    - host: cortex.cortexmonitoring.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 3000 } }
