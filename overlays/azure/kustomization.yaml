apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production-shaped overlay for AKS.
#
# The `images:` digests below are rewritten automatically by the `gitops-handoff`
# job of the Cortex CI (yq edits `.images[].digest` matching `.name`), which opens
# a PR here. Do not hand-edit them except for the first bootstrap.
namespace: cortex
resources:
  - ../../base
  # Uncomment once you have sealed the secrets (see README, "Secrets"):
  # - sealed-cortex-secrets.yaml
  # - sealed-collector-ssh.yaml
  # Uncomment once you picked an ingress controller and host:
  # - ingress.yaml
  # Falco on the nodes POSTs alerts here; see falco-intake.yaml.example:
  # - falco-intake.yaml
images:
  - name: ghcr.io/lakhal-farah/cortex-api
    # PLACEHOLDER until the first handoff PR lands.
    digest: sha256:eff6e572efabbf7c2bc2078665b8621a5bf591c83d19310779ed3355e39bbbf2
  - name: ghcr.io/lakhal-farah/cortex-web
    digest: sha256:fa702f2ae44d7a7271b8411de9900e95a5e45f4ff83aeb7a60cdbefb4d30f52c
  - name: ghcr.io/lakhal-farah/cortex-collector
    digest: sha256:dcc72f36220c41048f638c2d217848c129508ac00914e694683e4bd9c802e50f
configMapGenerator:
  - name: cortex-config
    behavior: merge
    literals:
      # TODO: set per environment.
      - CORTEX_PUBLIC_URL=https://cortex.example.com
      # - QDRANT_URL=https://<cluster>.cloud.qdrant.io:6333
      # - PROMETHEUS_URL=https://<prometheus>/api/v1/query
      # - PROMETHEUS_RANGE_URL=https://<prometheus>/api/v1/query_range
      # - PROMETHEUS_BASE_URL=https://<prometheus>
      # - LOKI_URL=https://<loki>
      # - SMTP_HOST=smtp.example.com
      # - CORTEX_KEYSTONE_EXPECTED_CIDRS=10.0.1.0/24
