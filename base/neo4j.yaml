apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: graph-database
spec:
  clusterIP: None            # governing service of the StatefulSet
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - { name: http, port: 7474, targetPort: http }
    - { name: bolt, port: 7687, targetPort: bolt }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: graph-database
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/component: graph-database
    spec:
      serviceAccountName: cortex
      automountServiceAccountToken: false
      # Without this Kubernetes injects NEO4J_PORT=tcp://... (from the Service
      # named "neo4j") and the image turns every NEO4J_* variable into a
      # config setting, which makes Neo4j refuse to start.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neo4j
          image: neo4j               # tag set via kustomize `images:`
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 7474 }
            - { name: bolt, containerPort: 7687 }
          env:
            # Must be defined before NEO4J_AUTH: $(VAR) only expands earlier entries.
            - name: CORTEX_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: CORTEX_NEO4J_PASSWORD }
            - { name: NEO4J_AUTH, value: "neo4j/$(CORTEX_NEO4J_PASSWORD)" }
            - { name: NEO4J_server_memory_heap_initial__size, value: 512m }
            - { name: NEO4J_server_memory_heap_max__size, value: 512m }
            - { name: NEO4J_server_memory_pagecache_size, value: 256m }
          securityContext:
            allowPrivilegeEscalation: false
            # EXCEPTION: the Neo4j 5 entrypoint rewrites files under
            # /var/lib/neo4j (conf, run, plugins) at start-up. TODO: tighten to
            # `true` + targeted emptyDirs after the k3d rehearsal shows exactly
            # which paths it needs.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { cpu: "1", memory: 1536Mi }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: bolt }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /logs }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: logs, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
