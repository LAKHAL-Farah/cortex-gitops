apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data
  labels:
    app.kubernetes.io/name: api
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  # One replica on purpose: the API runs its schedulers (anomaly detection,
  # digests, forecasts, ...) in-process, so a second replica would run them twice.
  replicas: 1
  strategy:
    type: Recreate           # ReadWriteOnce volume + singleton schedulers
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: cortex
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/lakhal-farah/cortex-api   # digest set via kustomize `images:`
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: cortex-config }
          env:
            # Writable locations for a read-only root filesystem.
            - { name: HOME, value: /tmp }
            - { name: TMPDIR, value: /tmp }
            - { name: XDG_CACHE_HOME, value: /tmp/.cache }
            # OpenStack SDK: read-only reader identity from the `openstack-clouds` Secret.
            - { name: OS_CLOUD, value: cortex-reader }
            - { name: OS_CLIENT_CONFIG_FILE, value: /etc/openstack/clouds.yaml }
            # --- secrets (required) ---
            # Order matters: DATABASE_URL expands $(CORTEX_DB_PASSWORD), so use a
            # URL-safe password (no @ : / ? # %).
            - name: CORTEX_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: CORTEX_DB_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg2://cortex:$(CORTEX_DB_PASSWORD)@postgres:5432/cortex"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: CORTEX_NEO4J_PASSWORD }
            - name: CORTEX_API_KEY
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: CORTEX_API_KEY }
            - name: CORTEX_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: CORTEX_JWT_SECRET }
            # CORTEX_ENV=production refuses to start with an unset/"admin" password.
            - name: CORTEX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: CORTEX_ADMIN_PASSWORD }
            # --- secrets (optional: the feature degrades when absent) ---
            # QDRANT_URL is sealed too (cloud URLs can embed the cluster id). When the key is
            # absent the ConfigMap's QDRANT_URL (if any) applies; when present this wins.
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: QDRANT_URL, optional: true }
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: QDRANT_API_KEY, optional: true }
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: NVIDIA_API_KEY, optional: true }
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: TAVILY_API_KEY, optional: true }
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: SMTP_USERNAME, optional: true }
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: cortex-secrets, key: SMTP_PASSWORD, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 2Gi }
          # Start-up = wait for DB + alembic migrations + loading torch/embeddings.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health/db, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
            - { name: file-sd, mountPath: /file_sd }
            - { name: openstack-clouds, mountPath: /etc/openstack, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
        - name: file-sd
          emptyDir: { sizeLimit: 16Mi }
        # optional: the pod still starts (OpenStack features degrade) until the
        # sealed `openstack-clouds` Secret is enabled in the overlay.
        - name: openstack-clouds
          secret:
            secretName: openstack-clouds
            optional: true
            defaultMode: 0440       # fsGroup 10001 can read it
        - name: data
          persistentVolumeClaim:
            claimName: api-data
